<html lang="en">
	<head>
		<meta charset="UTF-8">

		<title>Bouncing Clock</title>

		<style>
			html {
				overflow: hidden;
			}

			body {
				margin: 0;
				box-sizing: border-box;
				overflow: hidden;
				font-size:40px;
				cursor:none;
				background-color: #000;
			}

			#black {
				height: calc(100% - 6px);
				width: calc(100% - 6px);
				z-index: 500;
			}

			.blackhole, #dvd, .dvd-ghost {
				position: fixed;
				z-index: 500;

				margin:0px;
				padding:0px;

				display: table-row;

				white-space: nowrap;
				background-repeat: no-repeat;
				background-size: 75px;
				background-position: center;
				font-size: 60px;

				text-align: center;
			}

			.blackhole {
				background-color:#000;
				height:1px;
				width:1px;
			}

			#dvd, .dvd-ghost {
				color:#fff;
				align-items: center;
				height:5px;
				min-width: 200px;
				max-width: 400px;
			}

			#hitbox {
				position: fixed;
				z-index: 501;
				margin: 0px;
				padding: 0px;
				box-sizing: border-box;
				pointer-events: none;
				display: none;
			}

			#day {
				position: absolute;
				color: #555;
				z-index: 2;
				font-family: Arial, Helvetica, sans-serif;
				font-weight: 900;
				margin: 0px;
				padding: 0px;
				opacity: 0;
				animation: backgroundColorPalette 5s linear;
			}

			/* The snackbar - position it at the bottom and in the middle of the screen */
			#snackbar {
			  visibility: hidden; /* Hidden by default. Visible on click */
			  background-color: #333;
			  color: #fff;
			  text-align: center;
			  border-radius: 2px;
			  padding: 16px;
			  position: fixed;
			  z-index: 1;
			  bottom: 30px;
			  left: 50%;
			  transform: translateX(-50%);
			}

			/* Show the snackbar when the preset changes (class added with JavaScript) */
			#snackbar.show {
			  visibility: visible;
			  animation: fadein 0.5s, fadeout 0.5s 2.5s;
			}

			@keyframes fadein {
			  from {bottom: 0; opacity: 0;}
			  to {bottom: 30px; opacity: 1;}
			}

			@keyframes fadeout {
			  from {bottom: 30px; opacity: 1;}
			  to {bottom: 0; opacity: 0;}
			}

			@keyframes backgroundColorPalette {
				0% { opacity: 0; }
				25% { opacity: 1; }
				50% { opacity: 0; }
				100% { opacity: 0; }
			}

			@keyframes zoom {
				0% { font-size: 0px; }
				50% { font-size: 75px; }
				100% { font-size: 0px; }
			}

			@keyframes flyzoom {
				0% { font-size: 30px; }
				50% { font-size: 70px; }
				100% { font-size: 30px; }
			}

			@keyframes bigzoom {
				0% { transform: scale(0.01); }
				100% { transform: scale(4.5); }
			}

			@keyframes zoomy {
				0% { font-size: 40px; }
				50% { font-size: 75px; }
				100% { font-size: 40px; }
			}

			@keyframes rotation {
				0% { transform: rotate(330deg); }
				50% { transform: rotate(390deg); }
				100% { transform: rotate(330deg); }
			}

			@keyframes annoyingrotation {
				0% { transform: rotate(0deg); }
				50% { transform: rotate(-720deg); }
				100% { transform: rotate(0deg); }
			}

			@keyframes inverseannoyingrotation {
				0% { transform: rotate(0deg); }
				50% { transform: rotate(720deg); }
				100% { transform: rotate(0deg); }
			}

			@keyframes wiggle {
				0% { transform: rotate(350deg); }
				50% { transform: rotate(370deg); }
				100% { transform: rotate(350deg); }
			}

			@keyframes drunkard {
				0% { transform: rotate(355deg); }
				50% { transform: rotate(365deg); }
				100% { transform: rotate(355deg); }
			}

			@keyframes inversedrunkard {
				0% { transform: rotate(365deg); }
				50% { transform: rotate(355deg); }
				100% { transform: rotate(365deg); }
			}

			@keyframes rot1 {
				0%   { transform: rotate(var(--from-rot)); }
				50%  { transform: rotate(var(--to-rot)); }
				100% { transform: rotate(var(--from-rot)); }
			}

			@keyframes rot1p {
				0%   { transform: rotate(var(--to-rot)); }
				50%  { transform: rotate(var(--from-rot)); }
				100% { transform: rotate(var(--to-rot)); }
			}
		</style>
	</head>

	<body translate="no" id="bod">
		<div id="black">
			<h2 id="dvd">TIMESTAMP</h2>
		</div>
		<h2 id="dvdGhostX" class="dvd-ghost" style="display:none"></h2>
		<h2 id="dvdGhostY" class="dvd-ghost" style="display:none"></h2>
		<span id="day">DATE</span>
		<div id="snackbar"></div>
		<div id="hitbox"></div>

		<!-- Engine: clock/date state, the reusable Mover, and the frame loop -->
		<script>
			const dvd   = document.getElementById("dvd"),
			      day   = document.getElementById("day"),
			      bg    = document.getElementById("black"),
			      snack = document.getElementById("snackbar"),
			      hitbox = document.getElementById("hitbox"),
			      dvdGhostX = document.getElementById("dvdGhostX"),
			      dvdGhostY = document.getElementById("dvdGhostY");

			const PRESETS = ["Random",
			                 "DVD logo...?",
			                 "Whip it",
			                 "Zoomies",
			                 "Speen",
			                 "Corner Shot!",
			                 "DVD logo... But With Acceleration!",
			                 "Accelerate!",
			                 "Medical Emergency",
			                 "Fly in a Jar",
			                 "Two Shots of Vodka",
			                 "Speeding Trap Ahead",
			                 "Moth to a Flame",
			                 "Spaghettification",
			                 "Restraining Order",
			                 "White Hole",
			                 "Sir Wobbleton's Trigonometric Gravy Roulette",
			                 "Sugar Rush",
			                 "Frenemies",
			                 "Repulsive"];

			// Physics feature flags. The preset functions flip these; every Mover reads them.
			const fx = {
				aimForCorners: false,
				edgesGoFastInstead: false,
				speedUpFasterFromEdges: false,
				gravityWell: false,
				doAcceleration: false,
				doDeceleration: false,
				useSineWaveOffset: false,
				useCubicAcceleration: true,
				waitBeforeNextBounce: false,
				pullTowardBH: "",            // "" | "thrust" | "gravity" | "shove" | "whitehole"
				trigChase: false,            // reroll pullTowardBH at every wall, and wobble the pull
				pastelOnly: false,
				chaseAccelMul: 1,            // scales both the pull and its cap; 1 = normal chase() strength
				chaseAccelRandom: false,     // reroll chaseAccelMul 1x-10x on every wall bounce
				repulsive: false,            // hole always attracts, whoever isn't the hole always flees
				// Wrap replaces the bounce on that axis alone; deliberately NOT in NO_MOTION so a
				// preset's per-second setFX(NO_MOTION) reroll can't silently turn it back off.
				wrapX: false, wrapY: false,
			};
			const BH_MODES = ["thrust", "gravity", "shove", "whitehole"];
			// Gravity slingshots: one close pass spends hundreds of frames near max pull and comes
			// out pinned at BH_MAX_SPEED, and a central force plus a restitution centered on 1.0
			// never takes that back. So bleed it off, but only the part above cruising speed. A
			// flat drag can't work here: far from the hole the pull is ~0 and a universal bleed
			// grinds the clock to a dead 0.3 px/frame crawl. This leaves ordinary motion alone and
			// only eats the launches. Gravity only; the white hole doesn't slingshot to begin with.
			const BH_DRAG = { gravity: 0.03 }, BH_ROULETTE_DRAG = 0.03,
			      BH_CRUISE = 6, BH_MAX_DRAG = 0.5, BH_MAX_ACCEL = 8;
			// Spread this in a preset to clear every motion flag, then turn on what you want.
			const NO_MOTION = {
				aimForCorners: false, edgesGoFastInstead: false, speedUpFasterFromEdges: false,
				gravityWell: false, doAcceleration: false, doDeceleration: false,
				useSineWaveOffset: false, useCubicAcceleration: false, pullTowardBH: "", trigChase: false,
				chaseAccelMul: 1, chaseAccelRandom: false, repulsive: false,
			};
			const setFX = o => Object.assign(fx, o);

			// Frame/clock state
			let min = 0, sec = 0, lastSecond = -1, tick = true,
			    screenWidth = 0, screenHeight = 0,
			    firstRun = true, firstFrameOfHour = true,
			    funcGroup = 1,
			    movementType = "DVD",
			    holeMode = "DVD", holeJumpEvery = 5,
			    holeZoomiesMs = 0, lastHoleTeleport = 0,   // 0 = normal per-second Zoomies cadence
			    isMouseHover = false,
			    debugmode = false,
			    doReposition = true, doAnimationOnRePosition = false,
			    repositionInterval = 5, nextRepositionSecond = 0, fadetimersynch = -1,
			    drunkardReset = true, drunkardFunction = "",
			    drunkardA = 0.1, drunkardB = 0.1, drunkardC = 0.1, drunkardD = 0.1,
			    drunkardFactor = 25,
			    bg6synch = 0,
			    a2 = 0, b2 = 0, c2 = 0, d2 = 0;

			// Tuning knobs
			const MIN_SPEED = 0.2,
			      SINE_STRETCH_MIN = 10.0, SINE_STRETCH_MAX = 250.0,
			      SINE_AMPLIFY_MIN = 1.0,  SINE_AMPLIFY_MAX = 5.0,
			      CUBIC_MIN_MUL = 1, CUBIC_MAX_MUL = 10,
			      CUBIC_MIN_FRAMES = 100, CUBIC_MAX_FRAMES = 2000,
			      ACCEL_OFFSET = 1, ACCEL_MULTIPLIER = 0.1,
			      DECEL_MULTIPLIER = 0.25,
			      BOUNCE_WAIT_MIN = 0, BOUNCE_WAIT_MAX = 100,
			      // Black hole chase, all in px/frame. THRUST never lets up, hence the overshoot.
			      BH_THRUST = 0.05, BH_MASS = 2000, BH_MAX_PULL = 2.0, BH_MAX_SPEED = 30,
			      // The chase multiplier rides the minute hand: sedate at :00, vicious at :59.
			      BH_MUL_AT_00 = 0.25, BH_MUL_AT_59 = 3.0, BH_MUL_JITTER = 0.25,
			      // Raw power on top of that, rerolled with it. 3x was the old fixed setting.
			      BH_POWER_MIN = 0.25, BH_POWER_MAX = 1.5,
			      // ...scaled by how far the hole is when the roll happens: sitting on top of it
			      // means a gentle push, a full screen diagonal away means a hard run at it.
			      BH_FAR_NEAR = 0.75, BH_FAR_AWAY = 1.5,
			      // Restitution: >1 means the wall can kick it back harder than it arrived.
			      // Centered on 1.0 on purpose. The pull is a central force and adds no energy,
			      // so a mean below 1 drains the system every wall until the hole captures it.
			      BH_BOUNCE_MIN = 0.75, BH_BOUNCE_MAX = 1.25,
			      // ...but thrust and shove are NOT central forces. They never let up, so they
			      // pump energy in every pass and a mean of 1.0 pins the clock at BH_MAX_SPEED.
			      // These walls have to take some back.
			      BH_THRUST_BOUNCE_MIN = 0.45, BH_THRUST_BOUNCE_MAX = 0.9,
			      // Ceiling on the trig-driven chase multiplier. Draws are normalized by their mean
			      // level, not their crest: what reads on screen is the typical frame, and dividing
			      // by the peak buried every shape that spikes. That's what "not enough" looked like.
			      // Tuned by measurement, not arithmetic: clamping the crests trims the mean back,
			      // and by how much depends on the draw. These land the typical pull around 6-8,
			      // against the flat 3.0 the old clamp pinned it at. MAX is the knob; it scales
			      // the whole thing linearly.
			      TRIG_WOBBLE_MAX = 16, TRIG_TARGET_MEAN = 0.5,
			      // The same probed wave also steers the position directly, in px/frame at full
			      // swing, so Wobbleton is trig *motion* on top of a trig-modulated pull instead of
			      // only the latter. Deliberately under the chase's scale: a wobble on the path.
			      TRIG_DRIFT = 6,
			      // Gravity's curve, Wobbleton only. COMPRESS < 1 raises everything below the cap,
			      // most of all the weak far field; PULL is the ceiling that replaces BH_MAX_PULL.
			      // Both are deliberately mild: the point is a hole you can feel across the screen,
			      // not a flat thrust with an inverse-square paint job.
			      TRIG_GRAV_COMPRESS = 0.75, TRIG_GRAV_PULL = 1.6,
			      // A wave centered on zero is a shaker, not a force: over a cycle it undoes its own
			      // pull and the clock ends up jittering with no net relationship to the hole (net
			      // was 18% of gross, measured; some draws netted ~0). Ride the wave on top of a DC
			      // bias so there's always attraction underneath. Below 1.0 the deep troughs still
			      // punch through into genuine reversal, which is the fun part.
			      TRIG_BIAS = 0.35,
			      // ...and a shape too spiky to normalize at all gets thrown back. Measured crest
			      // factor is 1.6-4.5 for every wave here except the tan spike train, which is ~300.
			      TRIG_MAX_CREST = 8,
			      // Long enough to cover a full period at the slowest stretch (~2*PI*250 frames).
			      TRIG_PROBE_FRAMES = 2000, TRIG_DEAD_WAVE = 1e-6,
			      // A plain mover's own cycle length, in ms. Nothing to do with the hour. Tune to taste.
			      CYCLE_MS_MIN = 25000, CYCLE_MS_MAX = 90000;

			/* ---------- tiny helpers ---------- */

			// NB: args read (max, min) at every call site. Range is the same either way.
			const randomBetween = (max, min) => Math.random() * (max - min) + min;
			const coin = () => Math.floor(randomBetween(0, 2)) == 0;
			const randomItem = arr => arr[Math.floor(Math.random() * arr.length)];
			const randomSpeed = sf => MIN_SPEED + sf * Math.random();
			// Constant-force modes get a lossy wall; the inverse-square ones don't need it.
			const restitutionRange = () => (fx.pullTowardBH == "thrust" || fx.pullTowardBH == "shove")
				? [BH_THRUST_BOUNCE_MIN, BH_THRUST_BOUNCE_MAX]
				: [BH_BOUNCE_MIN, BH_BOUNCE_MAX];

			function getDate(){
				return new Date();
			}

			function bezier(t, initial, p1, p2, final){
				return (1 - t) * (1 - t) * (1 - t) * initial
					+ 3 * (1 - t) * (1 - t) * t * p1
					+ 3 * (1 - t) * t * t * p2
					+ t * t * t * final;
			}

			function stretchedPolyOverExp(t, stretch, skew) {
				t = t + skew;
				return (t * t) / (stretch * stretch * Math.pow(Math.E, t / stretch));
			}

			// Wave shapes for the sine offset. Index = wave function id.
			const SINE_FUNCS = [
				(a, st, v, sp)     => sp*a*Math.sin(v/st) - st,
				(a, st, v, sp)     => sp*a*Math.sin((v - Math.sin(v))/st),
				(a, st, v, sp)     => { v /= 10.0;      return sp*a*a*Math.sin(v - Math.sin(v/st)); },
				(a, st, v, sp)     => { v /= 10.0;      return sp*a*Math.sin((v * Math.sin(v))/st); },
				(a, st, v, sp)     => { v /= a*a;       return sp*a*a*Math.sin(v * Math.sin(v/st)); },
				(a, st, v, sp)     => { v /= 5.0*a;     return sp*a*Math.sin(v*v/st) + Math.sin(v); },
				(a, st, v, sp)     => { v = Math.abs(v/(sp*(250.0-sp))); return sp*a*Math.sin(v*v/sp); },
				(a, st, v, sp)     => { v /= 10.0*a;    return sp*Math.sin(v*Math.tan(v)/st)/Math.tan(v); },
				(a, st, v, sp, ws) => sp*a*Math.sin(v*Math.tan(v/st))/Math.tan(v/st)/(60-ws),
				(a, st, v, sp, ws) => { v /= 25;        return sp*sp*a*a*Math.sin(v*v/(st*st*sp*sp))*Math.sin(v)/(60-ws); },
				(a, st, v, sp)     => { v /= a*st;      return sp*a*a*a*Math.sin(v*v)*Math.sin(v/st); },
				(a, st, v, sp)     => { v /= 2500;      return sp*a*Math.sin((st * v) + Math.sin(v)) + v; },
				(a, st, v, sp)     => { v /= 2500;      return sp*a*Math.sin((st * v) + Math.cos(v) + v) + v; },
			];
			const SINE_DEFAULT = (a, st, v, sp) => sp*a*Math.sin(v/st);

			// wavesec/tempo default to the wall clock; plain movers pass their own so
			// their wave shape doesn't move in lockstep with the hour.
			function customSine(amplify, stretch, val, speed, wavefunc, wavesec, tempo){
				if(wavesec === undefined) wavesec = sec == 0 ? 1 : sec;
				if(tempo === undefined) tempo = 0.75 + (60 - min)/120.0;
				if(amplify == 0) amplify = 1e-10;
				if(stretch == 0) stretch = 1e-10;
				if(val == 0) val = 1e-10;
				speed = speed / 2.0;

				const f = SINE_FUNCS[wavefunc] || SINE_DEFAULT;
				return f(amplify, stretch, val, speed, wavesec) * tempo;
			}

			/* ---------- colors ---------- */

			// Converts numeric HSL ([0,360],[0,100],[0,100]) to RGB in hex
			function hslToHex(h, s, l) {
				l /= 100;
				const a = s * Math.min(l, 1 - l) / 100;
				const f = n => {
					const k = (n + h / 30) % 12;
					const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
					return Math.round(255 * color).toString(16).padStart(2, '0');
				};
				return `#${f(0)}${f(8)}${f(4)}`;
			}

			function getNewRandomColorHSL(minlightness) {
				// 50-50 chance of a fully saturated color, or of pastel
				if(coin()) return hslToHex(Math.floor(Math.random() * 360), 100, 50);
				return hslToHex(Math.floor(Math.random() * 360),
				                Math.floor(Math.random() * 100),
				                minlightness + Math.floor(Math.random() * 50));
			}

			// Holiday palette: dark/white/red plus one themed third color
			function festiveColor(third){
				const dark = Math.floor(randomBetween(0,8)).toString() + Math.floor(randomBetween(0,16)).toString(16);
				switch(Math.floor(randomBetween(0,3))){
					case 0:
						const white = Math.floor(randomBetween(8,16)).toString(16);
						return "#" + white.padStart(6, white);
					case 1:
						return "#FF" + dark + dark;
					default:
						return third(dark);
				}
			}

			// Sets the color of the DVD logo time thing
			function updateColor(){
				const today = getDate(), month = today.getMonth() + 1, date = today.getDate();

				if(month == 12 && date >= 13 && date <= 25)
					dvd.style.color = festiveColor(d => "#" + d + "FF" + d);          // Christmas
				else if(month == 7 && date <= 15)
					dvd.style.color = festiveColor(d => "#" + d + d + "FF");          // July 4th
				else
					dvd.style.color = getNewRandomColorHSL(fx.pastelOnly ? 80 : 50);
			}

			/* ---------- fonts: probe once, then just pick ---------- */

			const FONT_CANDIDATES = [...new Set([
				// Windows 10
				'Arial', 'Arial Black', 'Bahnschrift', 'Calibri', 'Cambria', 'Cambria Math', 'Candara', 'Comic Sans MS', 'Consolas', 'Constantia', 'Corbel', 'Courier New', 'Ebrima', 'Franklin Gothic Medium', 'Gabriola', 'Gadugi', 'Georgia', 'HoloLens MDL2 Assets', 'Impact', 'Ink Free', 'Javanese Text', 'Leelawadee UI', 'Lucida Console', 'Lucida Sans Unicode', 'Malgun Gothic', 'Microsoft Himalaya', 'Microsoft JhengHei', 'Microsoft New Tai Lue', 'Microsoft Sans Serif', 'Microsoft Tai Le', 'Microsoft YaHei', 'Microsoft Yi Baiti', 'MingLiU-ExtB', 'Mongolian Baiti', 'MS Gothic', 'MV Boli', 'Myanmar Text', 'Nirmala UI', 'Palatino Linotype', 'Segoe MDL2 Assets', 'Segoe Print', 'Segoe Script', 'Segoe UI', 'Segoe UI Historic', 'Segoe UI Emoji', 'SimSun', 'Sitka', 'Sylfaen', 'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Yu Gothic',
				// macOS
				'American Typewriter', 'Andale Mono', 'Arial Narrow', 'Arial Rounded MT Bold', 'Arial Unicode MS', 'Avenir', 'Avenir Next', 'Avenir Next Condensed', 'Baskerville', 'Big Caslon', 'Bodoni 72', 'Bodoni 72 Oldstyle', 'Bodoni 72 Smallcaps', 'Bradley Hand', 'Brush Script MT', 'Chalkboard', 'Chalkboard SE', 'Chalkduster', 'Charter', 'Cochin', 'Copperplate', 'Courier', 'Didot', 'DIN Alternate', 'DIN Condensed', 'Futura', 'Geneva', 'Gill Sans', 'Helvetica', 'Helvetica Neue', 'Herculanum', 'Lucida Grande', 'Luminari', 'Marker Felt', 'Menlo', 'Monaco', 'Noteworthy', 'Optima', 'Palatino', 'Papyrus', 'Phosphate', 'Rockwell', 'Savoye LET', 'SignPainter', 'Skia', 'Snell Roundhand', 'Times', 'Trattatello', 'Zapfino',
			])].sort();

			let availableFonts = ['Arial'];
			(async () => {
				await document.fonts.ready;
				const found = FONT_CANDIDATES.filter(f => document.fonts.check(`12px "${f}"`));
				if(found.length) availableFonts = found;
			})();

			const pickFont = ele => ele.style.fontFamily = randomItem(availableFonts);

			/* ---------- the reusable positioning system ---------- */

			// One bouncing thing. `full` turns on the sine/cubic/accel/decel pipeline
			// and corner aiming; a plain mover just bounces off the walls.
			// wFactor/hFactor are calibration knobs: the clock's real footprint is
			// clientWidth x 11*clientHeight because of the table-row layout.
			class Mover {
				constructor(el, opts){
					this.el = el;
					Object.assign(this, {
						x: 0, y: 0, dirX: 1, dirY: 1,
						speedX: 1.1, speedY: 1.1, speedfactor: 50.1,
						speedBoost: 10.0, boostFastest: 10.0, boostSlowest: 100.0,
						wFactor: 1, hFactor: 1, cornerHFactor: 1,
						full: false, chaseTarget: null,   // null = chase every spawned hole (the clock's case)
						isHole: false,   // only real holes (newHole()) carry their own push/pull draw
						ghostX: null, ghostY: null,   // wrap-around twins; only the clock has any (it's the only visible mover)
					}, opts);

					this.w = 0; this.h = 0;
					this.corner = 0;
					this.sineFrame = 0;
					this.accelFrame = 0;
					this.framesUntilNextBounce = 0;
					this.countingDown = false;
					this.chaseMul = 1;
					this.trigScale = 1;   // replaced by a probe at the first wall
					this.trigPhaseY = 100;
					this.sine = { xStretch: 100, yStretch: 100, xAmplify: 2, yAmplify: 2, xFunc: 1, yFunc: 1 };
					this.cubicX = newCubic();
					this.cubicY = newCubic();
					this.decel = { boostX: 20, skewX: 100, stretchX: 40, boostY: 20, skewY: 100, stretchY: 40 };

					// Plain movers run on their own clock. 0 start = roll over on the first frame.
					this.cycleStart = 0;
					this.cycleMs = randomBetween(CYCLE_MS_MAX, CYCLE_MS_MIN);
				}

				// 0..1 through this mover's cycle: the real hour for the clock, an
				// independent timer for everything else.
				phase(){
					return this.full ? (min + sec/60.0) / 60.0
					                 : (performance.now() - this.cycleStart) / this.cycleMs;
				}

				// Roll the cycle over when it runs out, and reroll its length so the
				// black hole never settles into a period you can predict off the clock.
				tickCycle(){
					if(this.full) return;
					const now = performance.now();
					if(now - this.cycleStart < this.cycleMs) return;

					this.cycleStart = now;
					this.cycleMs = randomBetween(CYCLE_MS_MAX, CYCLE_MS_MIN);
					this.newSpeeds();
				}

				// One layout read per frame instead of six.
				measure(){
					this.w = this.el.clientWidth * this.wFactor;
					this.h = this.el.clientHeight * this.hFactor;
				}

				place(){
					this.el.style.left = this.x + "px";
					this.el.style.top = this.y + "px";
					this.placeGhosts();
				}

				// The wrap twin: same look as the real element, offset by a full screen so the
				// part that's already wrapped off one edge shows up sliding in on the other.
				// Only drawn while it's actually hanging off that edge; hidden otherwise.
				placeGhosts(){
					if(this.ghostX){
						if(fx.wrapX && (this.x < 0 || this.x + this.w > screenWidth)){
							this.ghostX.style.cssText = this.el.style.cssText;
							this.ghostX.textContent = this.el.textContent;
							this.ghostX.style.left = (this.x + (this.x < 0 ? screenWidth : -screenWidth)) + "px";
							this.ghostX.style.top = this.y + "px";
						} else {
							this.ghostX.style.display = "none";
						}
					}
					if(this.ghostY){
						if(fx.wrapY && (this.y < 0 || this.y + this.h > screenHeight)){
							this.ghostY.style.cssText = this.el.style.cssText;
							this.ghostY.textContent = this.el.textContent;
							this.ghostY.style.left = this.x + "px";
							this.ghostY.style.top = (this.y + (this.y < 0 ? screenHeight : -screenHeight)) + "px";
						} else {
							this.ghostY.style.display = "none";
						}
					}
				}

				center(){
					this.x = (screenWidth - this.w) / 2;
					this.y = screenHeight / 2 - this.el.clientHeight * this.cornerHFactor;
				}

				update(){
					this.measure();
					this.tickCycle();
					this.bounceOffWalls();

					const prevX = this.x, prevY = this.y;
					this.x += this.dirX * this.speedX;
					this.y += this.dirY * this.speedY;

					// frozen mid-bounce: keep the state, skip the paint
					if(this.countingDown && fx.waitBeforeNextBounce) return;

					if(this.full && fx.pullTowardBH){
						if(this.chaseTarget) this.chase(this.chaseTarget);
						else for(const h of holes) this.chase(h);
					}
					// After chase, which is what advances sineFrame: same frame of the same wave.
					if(this.full && fx.trigChase) this.trigDrift();
					if(fx.speedUpFasterFromEdges) this.applyEdgeBoost(prevX, prevY);
					if(this.full) this.applyAcceleration();
					else this.applySineOffset();

					this.place();
				}

				bounceOffWalls(){
					// Chasing the hole means the wall only flips that axis: no random second flip,
					// and onBounce scales the speed instead of rerolling it.
					const elastic = this.full && fx.pullTowardBH;

					// Wrap: let it run fully off the far edge (place()/placeGhosts() already
					// showed the twin sliding in on the near edge) before folding it back on.
					// The fold has to move it by exactly screenWidth/screenHeight - the same
					// period placeGhosts() uses for the twin's offset - not screenWidth+this.w.
					// Off by the element's own width there swaps which side gets the sliver and
					// which gets the bulk of the shape, which reads as snapping back to the edge
					// it just crossed instead of continuing through it.
					// Everything onBounce() does still fires - color, chase reroll, stickiness,
					// the hole flinch - onBounce() itself never touches dirX/dirY, only the
					// classic-bounce branch below does that, so reusing it here carries no flip.
					if(fx.wrapX){
						if(this.x + this.w < 0){ this.x += screenWidth; this.onBounce(); }
						else if(this.x > screenWidth){ this.x -= screenWidth; this.onBounce(); }
					} else if(this.x + this.w >= screenWidth || this.x < 0){
						this.x = this.x < 0 ? 0 : screenWidth - 1 - this.w;
						this.dirX *= -1;
						if(!elastic && Math.round(0.75 * Math.random()) == 1) this.dirY *= -1;  // ~33% of the time
						this.onBounce();
					}

					if(fx.wrapY){
						if(this.y + this.h < 0){ this.y += screenHeight; this.onBounce(); }
						else if(this.y > screenHeight){ this.y -= screenHeight; this.onBounce(); }
					} else if(this.y + this.h >= screenHeight || this.y < 0){
						this.y = this.y < 0 ? 0 : screenHeight - 1 - this.h;
						this.dirY *= -1;
						if(!elastic && Math.round(0.75 * Math.random()) == 1) this.dirX *= -1;
						this.onBounce();
					}

					// Jiggle on mouse hover
					if(isMouseHover){
						this.dirX *= -1;
						this.dirY *= -1;
						this.newSpeeds();
					}
				}

				onBounce(){
					// Zoomies teleports the hole on a timer; a wall makes it flinch too. Before the
					// chase runs this frame, so the clock leaves the wall already aimed at the new
					// spot instead of spending a frame committed to where the hole used to be.
					if(this.full && holeMode == "RANDOM"){
						for(const h of holes){
							randomlyRepositionElement(h.el, 100, 100);
							syncHoleFromDOM(h);
						}
					}

					// Chase modes: the wall scales the incoming speed instead of rerolling it,
					// so the direction flip still carries momentum. Plus a color and a fresh accel.
					if(this.full && fx.pullTowardBH){
						// Floored: a run of low draws decays the speed to nothing and the clock
						// sits on the wall re-triggering the bounce every frame.
						const [lo, hi] = restitutionRange();
						const restitution = randomBetween(hi, lo);
						this.speedX = Math.max(this.speedX * restitution, MIN_SPEED);
						this.speedY = Math.max(this.speedY * restitution, MIN_SPEED);
						updateColor();
						this.rollChaseAccel();
						if(fx.trigChase) this.rollTrigChase();
						if(fx.chaseAccelRandom) fx.chaseAccelMul = randomBetween(0.25, 5);
						return;
					}

					const waiting = this.full && fx.waitBeforeNextBounce;
					if(waiting) this.countingDown = true;
					this.newSpeeds();
					if(!waiting) return;

					if(this.framesUntilNextBounce > 0){
						this.speedX = 0;
						this.speedY = 0;
					} else {
						this.framesUntilNextBounce = Math.floor(randomBetween(BOUNCE_WAIT_MIN, BOUNCE_WAIT_MAX));
					}
				}

				// Called once per frame while parked, to un-park.
				tickCountdown(){
					if(!this.countingDown) return;
					if(--this.framesUntilNextBounce >= 0) return;

					this.framesUntilNextBounce = 0;
					this.countingDown = false;
					this.newSpeeds();
					this.framesUntilNextBounce = Math.floor(randomBetween(BOUNCE_WAIT_MIN, BOUNCE_WAIT_MAX));
				}

				newSpeeds(){
					this.speedBoost = randomBetween(this.boostFastest, this.boostSlowest);

					if(!this.full){
						this.speedX = randomSpeed(this.speedfactor);
						this.speedY = randomSpeed(this.speedfactor);
						// Own wave shape, rerolled on its own cycle. Func 0 is skipped:
						// its constant -stretch term just pins a slow mover to a wall.
						this.sine = {
							xStretch: randomBetween(SINE_STRETCH_MIN, SINE_STRETCH_MAX),
							yStretch: randomBetween(SINE_STRETCH_MIN, SINE_STRETCH_MAX),
							xAmplify: randomBetween(SINE_AMPLIFY_MIN, SINE_AMPLIFY_MAX),
							yAmplify: randomBetween(SINE_AMPLIFY_MIN, SINE_AMPLIFY_MAX),
							xFunc: Math.floor(randomBetween(1, 13)),
							yFunc: Math.floor(randomBetween(1, 13)),
						};
						return;
					}

					this.accelFrame = 0;
					this.sine = {
						xStretch: randomBetween(SINE_STRETCH_MIN, SINE_STRETCH_MAX),
						yStretch: randomBetween(SINE_STRETCH_MIN, SINE_STRETCH_MAX),
						xAmplify: randomBetween(SINE_AMPLIFY_MIN, SINE_AMPLIFY_MAX),
						yAmplify: randomBetween(SINE_AMPLIFY_MIN, SINE_AMPLIFY_MAX),
						xFunc: Math.floor(randomBetween(0, 13)),
						yFunc: Math.floor(randomBetween(0, 13)),
					};
					this.cubicX = newCubic();
					this.cubicY = newCubic();

					updateColor();
					// Speed ceiling follows the hour: slow at :00, frantic near :59
					const curmin = min + sec/60.0;
					this.speedfactor = (1e-5*Math.pow(curmin,4)) - (0.0009*Math.pow(curmin,3))
					                 + (0.0262*Math.pow(curmin,2)) - (0.1815*curmin) + 1.0482;

					if(fx.aimForCorners){
						this.corner = 0;
						this.aimNearCorner();
					} else {
						this.speedX = randomSpeed(this.speedfactor);
						this.speedY = randomSpeed(this.speedfactor);

						if(fx.useSineWaveOffset && fx.doAcceleration){
							this.speedX += Math.sin(this.speedX) * Math.floor(randomBetween(-5,5));
							this.speedY += Math.cos(this.speedY) * Math.floor(randomBetween(-5,5));
						}
						if(fx.speedUpFasterFromEdges){
							const div = fx.gravityWell ? 20.0 : 2.0;
							this.speedX /= div;
							this.speedY /= div;
						}
						if(fx.doAcceleration){
							this.speedX *= ACCEL_MULTIPLIER;
							this.speedY *= ACCEL_MULTIPLIER;
						}
						if(fx.doDeceleration || fx.useCubicAcceleration){
							this.speedY *= DECEL_MULTIPLIER;
							this.decel = {
								boostX: randomBetween(10,30), skewX: randomBetween(100,200), stretchX: randomBetween(30,50),
								boostY: randomBetween(10,30), skewY: randomBetween(100,200), stretchY: randomBetween(30,50),
							};
						}
					}

					if(this.speedX == 0) this.speedX = 0.001;
					if(this.speedY == 0) this.speedY = 0.001;
				}

				// Really, there are 8 corners here. [0,5], [5,0], [0,h-5], [5,h], [w,5], [w-5,0], [w,h-5], [w-5,h]
				aimNearCorner(){
					const offset = 5;
					let cornerX = screenWidth - this.w;
					let cornerY = screenHeight - this.el.clientHeight * this.cornerHFactor;

					if(this.corner == 0) this.corner = Math.round(randomBetween(1,8));

					switch(this.corner){
						case 1: cornerX = 0;       cornerY = offset;  break;
						case 2: cornerX = offset;  cornerY = 0;       break;
						case 3: cornerX = 0;       cornerY -= offset; break;
						case 4: cornerX = offset;                     break;
						case 5:                    cornerY = offset;  break;
						case 6: cornerX -= offset; cornerY = 0;       break;
						case 7:                    cornerY -= offset; break;
						case 8: cornerX -= offset;                    break;
					}

					// Get from where we are now to the corner exactly.
					const getThereInNFrames = 100.0;
					this.speedX = Math.abs(this.x - cornerX) / getThereInNFrames;
					this.speedY = Math.abs(this.y - cornerY) / getThereInNFrames;

					if(Math.abs(this.speedX) < 0.25) this.speedX = randomSpeed(this.speedfactor);
					if(Math.abs(this.speedY) < 0.25) this.speedY = randomSpeed(this.speedfactor);
				}

				// Gravity well in the center of the screen (or at the edges, inverted)
				applyEdgeBoost(prevX, prevY){
					let disx = this.x, disy = this.y;
					if(screenWidth  - this.x - this.w < disx) disx = screenWidth  - this.x - this.w;
					if(screenHeight - this.y - this.h < disy) disy = screenHeight - this.y - this.h;

					if(fx.edgesGoFastInstead){
						disx = screenWidth/2 - disx;
						disy = screenHeight/2 - disy;
					}

					if(fx.gravityWell){
						if(fx.aimForCorners && this.full) this.aimNearCorner();  // keep our trajectory

						// the greater the distance, the greater the boost. Per frame, so small numbers.
						// Ramps over this mover's own cycle, not necessarily the hour.
						const ramp = (1 - this.phase()) * 60 + 1;
						this.x += disx * this.dirX / ramp;
						this.y += disy * this.dirY / ramp;
						return;
					}

					// we already moved DX/DY pixels. How many more, based on distance?
					const deltaX = this.dirX * Math.abs(this.x - prevX),
					      deltaY = this.dirY * Math.abs(this.y - prevY),
					      dis = fx.edgesGoFastInstead ? Math.max(disx, disy) : Math.min(disx, disy);

					this.x += deltaX * dis / this.speedBoost;
					this.y += deltaY * dis / this.speedBoost;
				}

				// Rerolled at every wall. The ceiling rises linearly with the minute hand, so the
				// same preset creeps at :00 and slams around at :59; the jitter keeps two bounces
				// in the same minute from feeling identical.
				rollChaseAccel(){
					const t = (min + sec/60.0) / 60.0;
					// 0 when we're on top of the hole, 1 a full screen diagonal away.
					// No target (no holes spawned) means nothing to scale by: treat as far.
					const target = this.chaseTarget || nearestHole(this);
					const far = target ? Math.min(this.distanceTo(target) / (Math.hypot(screenWidth, screenHeight) || 1), 1) : 1;
					this.chaseMul = (BH_MUL_AT_00 + (BH_MUL_AT_59 - BH_MUL_AT_00) * t)
					              * randomBetween(1 + BH_MUL_JITTER, 1 - BH_MUL_JITTER)
					              * randomBetween(BH_POWER_MAX, BH_POWER_MIN)
					              * (BH_FAR_NEAR + (BH_FAR_AWAY - BH_FAR_NEAR) * far);
				}

				// Pure shape, no scale: fixed speed and wavesec keep the wave from drifting as
				// the clock speeds up or the second hand moves, so one probe stays valid.
				rawTrig(frame){
					const s = this.sine;
					return customSine(s.xAmplify, s.xStretch, frame, 2, s.xFunc, 30, 1);
				}

				// The roulette: every wall picks a new relationship with the hole and a new
				// wave shape to feel it through. Func 0 is skipped, its constant -stretch term
				// pins the wobble to the clamp and the pull just runs backwards forever.
				//
				// Raw amplitude swings by orders of magnitude between shapes: some pin the clamp
				// on every frame, others sit at zero for thousands. So probe each draw, normalize
				// it to its own mean level, and throw back anything flat or too spiky to feel.
				// ponytail: O(TRIG_PROBE_FRAMES) per wall, ~0.1ms. Precompute per (func, stretch)
				// if bounces ever get cheap enough for this to show up.
				rollTrigChase(){
					// Push/pull is rolled per hole, not once for the pack: on the clock's own
					// bounce every hole gets its own independent draw; a hole bouncing on its
					// own wall (Frenemies/Repulsive) only rerolls itself.
					if(this.isHole) this.pullMode = randomItem(BH_MODES);
					else for(const h of holes) h.pullMode = randomItem(BH_MODES);
					this.sineFrame = 0;

					for(let attempt = 0; attempt < 6; attempt++){
						this.sine = {
							...this.sine,
							xStretch: randomBetween(SINE_STRETCH_MIN, SINE_STRETCH_MAX),
							xAmplify: randomBetween(SINE_AMPLIFY_MIN, SINE_AMPLIFY_MAX),
							xFunc: Math.floor(randomBetween(1, 13)),
						};

						let sum = 0, peak = 0;
						for(let f = 0; f < TRIG_PROBE_FRAMES; f++){
							const v = Math.abs(this.rawTrig(f));
							sum += v;
							if(v > peak) peak = v;
						}
						const mean = sum / TRIG_PROBE_FRAMES;
						if(mean <= TRIG_DEAD_WAVE) continue;       // flat draw, nothing to ride
						if(peak/mean > TRIG_MAX_CREST) continue;   // spike train, nothing to feel

						this.trigScale = TRIG_TARGET_MEAN / mean;
						// Roughly a quarter period of this draw, so X and Y don't move as one.
						this.trigPhaseY = Math.round(1.57 * this.sine.xStretch);
						return;
					}
					this.trigScale = 0;   // six unusable draws in a row: coast this leg
				}

				// The wave as motion, not just as a gain on the pull: gravity moves the clock toward
				// the hole, this moves it along the shape at the same time. Reuses the wave the probe
				// already normalized (so it can't hand back a dead or spiky draw), read a quarter
				// period later on Y so the drift traces a figure instead of a diagonal line.
				// Fixed amplitude on purpose: scaling by speedX would let a 30 px/frame slingshot
				// fling the clock a screen width in one frame.
				trigDrift(){
					this.x += TRIG_DRIFT * this.driftAt(this.sineFrame);
					this.y += TRIG_DRIFT * this.driftAt(this.sineFrame + this.trigPhaseY);
				}

				// Unbiased, unlike trigWobble: a DC term here would be a constant sideways shove.
				driftAt(frame){
					return Math.max(Math.min(this.trigScale * this.rawTrig(frame), 1), -1);
				}

				// Chase strength on a wave instead of a constant. Scaled so a typical frame sits
				// at TRIG_TARGET_MEAN of full, then ridden on top of TRIG_BIAS so the pull nets
				// out toward the hole instead of cancelling. The clamp is for the crests.
				trigWobble(){
					const w = this.trigScale * this.rawTrig(this.sineFrame++);
					const shaped = TRIG_BIAS + (1 - TRIG_BIAS) * Math.max(Math.min(w, 1), -1);
					return shaped * TRIG_WOBBLE_MAX;
				}

				// Hitbox center to hitbox center.
				distanceTo(other){
					return Math.hypot((other.x + other.w/2) - (this.x + this.w/2),
					                  (other.y + other.h/2) - (this.y + this.h/2)) || 1;
				}

				// Steer toward another mover, hitbox center to hitbox center. Accelerates the
				// velocity, never the position, so momentum carries it past the target.
				//   "thrust":    constant pull, no brakes. Guaranteed overshoot, every pass.
				//   "gravity":   inverse-square, so the last few pixels yank hardest.
				//   "shove":     thrust with the sign flipped, running away forever.
				//   "whitehole": inverse-square outward, ignorable far off, a kick up close.
				// ponytail: fixed mass, give Movers a `mass` field if anything else ever attracts.
				chase(other){
					const dx = (other.x + other.w/2) - (this.x + this.w/2),
					      dy = (other.y + other.h/2) - (this.y + this.h/2),
					      dist = this.distanceTo(other);
					// Only the roulette (trigChase) presets roll a push/pull draw per hole; the fixed-
					// mode presets (Moth to a Flame, White Hole, ...) share one mode for every hole,
					// same as before - a hole's own leftover spawn-time draw must not override it.
					const holeSide = this.isHole ? this : other;
					let mode = fx.trigChase ? (holeSide.pullMode || fx.pullTowardBH) : fx.pullTowardBH;
					// Repulsive: a hole always attracts and whoever isn't a hole (the clock) always
					// flees, whichever base type (gravity/thrust) that hole's own draw picked.
					if(fx.repulsive){
						const attract = mode == "whitehole" ? "gravity" : mode == "shove" ? "thrust" : mode;
						mode = this.isHole ? attract : (attract == "gravity" ? "whitehole" : "shove");
					}
					const inverseSquare = mode == "gravity" || mode == "whitehole",
					      sign = (mode == "shove" || mode == "whitehole") ? -1 : 1;

					// Capped twice, and the second one matters: BH_MAX_PULL bounds the inverse-square
					// term, but chaseMul and the wave multiply on top of it, so on its own it isn't
					// a ceiling at all. The roulette turned a "capped" 2.0 into 30-odd and pinned
					// the clock at BH_MAX_SPEED. BH_MAX_ACCEL is the one that actually holds.
					const wobble = fx.trigChase ? this.trigWobble() : 1;
					let base = inverseSquare ? Math.min(BH_MASS / (dist*dist), BH_MAX_PULL) : BH_THRUST;
					// Wobbleton flattens gravity's curve. Raw inverse-square is all or nothing here:
					// a yank inside arm's reach and nothing at all across the room, which reads as
					// the wave doing all the work and the hole doing none. Compressing the normalized
					// pull lifts the far field without changing the shape, and the lower ceiling
					// takes the close-range yank back down. Gravity only; the other three are either
					// flat already or exist to be violent up close.
					if(fx.trigChase && mode == "gravity")
						base = Math.pow(base / BH_MAX_PULL, TRIG_GRAV_COMPRESS) * TRIG_GRAV_PULL;
					const raw = sign * this.chaseMul * wobble * base * fx.chaseAccelMul;
					const accelCap = BH_MAX_ACCEL * fx.chaseAccelMul;
					const accel = Math.max(Math.min(raw, accelCap), -accelCap);

					let vx = this.dirX * this.speedX + accel * dx/dist,
					    vy = this.dirY * this.speedY + accel * dy/dist;

					let v = Math.hypot(vx, vy);

					// Governor: bleed only the speed above cruising, so a slingshot decays back to
					// a sane pace over ~a second while normal drifting is left untouched. It scales
					// with the wave, because a flat 3% can't hold back a pull the roulette just
					// multiplied by 16, and that pinned the clock at the cap for 4% of its life.
					// Every roulette mode gets governed, not just gravity: at 16x even flat thrust
					// climbs to the cap and stays there.
					const baseDrag = fx.trigChase ? BH_ROULETTE_DRAG : (BH_DRAG[mode] || 0);
					const drag = Math.min(baseDrag * Math.max(1, Math.abs(wobble)), BH_MAX_DRAG);
					if(drag && v > BH_CRUISE){
						const eased = BH_CRUISE + (v - BH_CRUISE) * (1 - drag);
						vx *= eased/v; vy *= eased/v;
						v = eased;
					}

					if(v > BH_MAX_SPEED){ vx *= BH_MAX_SPEED/v; vy *= BH_MAX_SPEED/v; }

					this.dirX = vx < 0 ? -1 : 1; this.speedX = Math.abs(vx);
					this.dirY = vy < 0 ? -1 : 1; this.speedY = Math.abs(vy);
				}

				// Plain movers always ride a sine wave, driven by their own cycle phase
				// instead of min/sec, so the wobble never syncs up with the clock.
				applySineOffset(){
					const s = this.sine, p = Math.min(Math.max(this.phase(), 0), 1);
					const wavesec = 1 + 58*p, tempo = 0.75 + (1 - p)/2.0;
					this.x += this.dirX * customSine(s.xAmplify, s.xStretch, this.sineFrame, this.speedX, s.xFunc, wavesec, tempo);
					this.y += this.dirY * customSine(s.yAmplify, s.yStretch, this.sineFrame, this.speedY, s.yFunc, wavesec, tempo);
					this.sineFrame++;
				}

				applyAcceleration(){
					if(fx.useSineWaveOffset){
						const sinemul = fx.useCubicAcceleration ? 0.25 : 1.0;
						const s = this.sine;
						this.x += this.dirX * customSine(this.accelFrame + s.xAmplify, s.xStretch, this.sineFrame, this.speedX, s.xFunc) * sinemul;
						this.y += this.dirY * customSine(this.accelFrame + s.yAmplify, s.yStretch, this.sineFrame, this.speedY, s.yFunc) * sinemul;
						this.sineFrame++;
						if(fx.doAcceleration || fx.useCubicAcceleration || fx.doDeceleration) this.accelFrame++;
					} else {
						if(fx.doAcceleration){
							this.x += this.dirX * (this.accelFrame + ACCEL_OFFSET) * this.speedX;
							this.y += this.dirY * (this.accelFrame + ACCEL_OFFSET) * this.speedY;
							this.accelFrame++;
						}
						if(fx.doDeceleration){
							const d = this.decel;
							this.x += this.dirX * d.boostX * stretchedPolyOverExp(this.accelFrame, d.stretchX, d.skewX);
							this.y += this.dirY * d.boostY * stretchedPolyOverExp(this.accelFrame, d.stretchY, d.skewY);
							this.accelFrame++;
						}
					}

					if(!fx.useCubicAcceleration) return;

					this.x += this.cubicOffset(this.cubicX, this.dirX, this.speedX);
					this.y += this.cubicOffset(this.cubicY, this.dirY, this.speedY);

					if(this.accelFrame % this.cubicX.frames == 0) this.cubicX = newCubic();
					if(this.accelFrame % this.cubicY.frames == 0) this.cubicY = newCubic();
					this.accelFrame++;
				}

				cubicOffset(c, dir, speed){
					let mul = c.negate ? -1.0 : 1.0;
					if(fx.useSineWaveOffset) mul /= 4.0;
					const from = c.invert ? 1 : 0, to = c.invert ? 0 : 1;
					return mul * dir * c.mul * bezier((this.accelFrame % c.frames) / c.frames, from, c.p1, c.p2, to) * speed;
				}
			}

			function newCubic(){
				return {

					frames: Math.floor(randomBetween(CUBIC_MIN_FRAMES, CUBIC_MAX_FRAMES)),
					p1: randomBetween(-1.5, 1.5),
					p2: randomBetween(-1.5, 1.5),

			// The clock reserves 11 rows of height for bouncing, 6 for corner aiming.

			const BH_PRESET_MIN = 13;

					speedfactor: 1.1, speedBoost: 1.0, boostFastest: 1.0, boostSlowest: 1.0,
					chaseTarget: clock, isHole: true, pullMode: randomItem(BH_MODES),

			function addMoreHoles(){

			/* ---------- per-frame updates ---------- */

					if(sec != nextRepositionSecond && !firstRun){

					h.cycleStart = performance.now();

				for(const h of holes){

					h.el.style.bottom = "";

						if(h.el.style.display != "table-row") h.el.style.display = "table-row";
						if(!should) continue;
						randomlyRepositionElement(h.el, 100, 100);
						syncHoleFromDOM(h);

					return;

			function randomlyRepositionElement(ele, minX, minY){

				ele.style.right = "";
				ele.style.top = "";
				ele.style.bottom = "";

				if(posX > 50) ele.style.right = (100.0 - posX) + "%";
				else          ele.style.left = posX + "%";
				if(posY > 50) ele.style.bottom = (100.0 - posY) + "%";
				else          ele.style.top = posY + "%";
			}

			/* ---------- preset switching + input ---------- */

			function changeFuncGroup(preset){

					if(preset == 0){

						if(newgroup == funcGroup){
							changeFuncGroup(0);
							return;
						}

					funcGroup = newgroup;
					firstRun = true;

				if(funcGroup != prevGroup)

				bg.style.transform = "translateX(0px) rotate(0deg)"; // Reset and position

				bg.offsetHeight; /* trigger reflow */

				dvd.style.animation = 'none';
				dvd.offsetHeight; /* trigger reflow */

				fx.wrapX = Math.random() < 0.5;
				fx.wrapY = Math.random() < 0.5;

			// mark. preventDefault kills the autoscroll cursor (middle) and the context menu

			// the mousedown that precedes it).
			window.addEventListener("mousedown", e => {
				if(e.button == 0){
					fx.wrapY = !fx.wrapY;
					snack.className = "show";
					snack.textContent = "Vertical wrap: " + (fx.wrapY ? "on" : "off");
					setTimeout(() => snack.className = "", 1000);
				} else if(e.button == 2){
					e.preventDefault();
					fx.wrapX = !fx.wrapX;
					snack.className = "show";
					snack.textContent = "Horizontal wrap: " + (fx.wrapX ? "on" : "off");

			// Right click shouldn't pop up the browser's context menu.
			window.addEventListener("contextmenu", e => e.preventDefault(), false);

			// Space: toggle fullscreen.
			window.addEventListener("keydown", e => {
				if(e.code != "Space") return;
				e.preventDefault();
				if(document.fullscreenElement) document.exitFullscreen();
				else document.documentElement.requestFullscreen().catch(() => {});
			}, false);

			dvd.addEventListener("mouseleave", () => isMouseHover = false, false);
			dvd.addEventListener("mouseover", () => isMouseHover = true, false);

			// Pause/Break toggles hitbox outlines
			window.addEventListener("keyup", e => {
				if(e.code != "Pause") return;
				e.preventDefault();
				debugmode = !debugmode;
				bg.style.border  = debugmode ? "4px solid #00CCFF" : "none";
				hitbox.style.border  = debugmode ? "2px solid red" : "none";
				hitbox.style.display = debugmode ? "block" : "none";
				for(const h of holes) h.el.style.border = debugmode ? "2px solid green" : "none";
			}, false);

			// Up/Down: add or remove a black hole by hand, whatever the preset rolled.
			window.addEventListener("keydown", e => {
				if(e.code != "ArrowUp" && e.code != "ArrowDown") return;
				e.preventDefault();

				if(e.code == "ArrowUp" && holes.length < HOLE_MAX){
					holes.push(newHole());
				} else if(e.code == "ArrowDown" && holes.length > HOLE_MIN){
					holes.pop().el.remove();
				}
				tellHoleCount();
			}, false);

			/* ---------- frame loop ---------- */

			function animate() {
				window.requestAnimationFrame(animate);   // first, so a thrown error can't kill the clock

				updateGlobalVariables();
				if(tick){
					// Presets only ever read min/sec/firstRun, so once a second is enough.
					pickCSSAnimation(bg, funcGroup);
					pickCSSAnimation(dvd, funcGroup);
				}
				updateClock();
				updateDate();
				updateBlackHole();
				if(debugmode){
					// RANDOM mode positions dvd via left/right/top/bottom %, not the Mover -
					// clock.x/y/w/h are stale then, so there's nothing meaningful to outline.
					hitbox.style.display = movementType == "RANDOM" ? "none" : "block";
					hitbox.style.left    = clock.x + "px";
					hitbox.style.top     = clock.y + "px";
					hitbox.style.width   = clock.w + "px";
					hitbox.style.height  = clock.h + "px";
				}
				firstRun = false; // gate to refresh animations at the top of the hour
			}
		</script>

		<!-- CSS animation presets: one function per group, per element -->
		<script>

			function randABCD(){

			/* ---------- one runnable check: open with ?test ---------- */

					testHole.chase(clock);
					console.assert(testHole.dirX > 0, "repulsive: a hole is drawn toward the clock", testHole.dirX, testHole.speedX);

					Object.assign(testHole, { x: 300, y: 300, w: 0, h: 0, dirX: 1, dirY: 1, speedX: 0, speedY: 0 });
					Object.assign(clock,    { x: 100, y: 300, w: 0, h: 0, dirX: 1, dirY: 1, speedX: 0, speedY: 0 });
					clock.chase(testHole);
					console.assert(clock.dirX < 0, "repulsive: the clock flees a hole", clock.dirX, clock.speedX);

					fx.repulsive = savedRepulsive; fx.pullTowardBH = savedPull;
					restore(clock, clockSave);
				}

				// Chase bounce: flip that axis only, and scale both speeds by one restitution.
				// selfTest runs before the first frame, so the screen size isn't measured yet.
				const savedW = screenWidth, savedH = screenHeight;
				screenWidth = 1920; screenHeight = 1080;
				fx.pullTowardBH = "thrust";
				const ratios = [];
				for(let i = 0; i < 50; i++){
					const e = new Mover(dvd, { full: true, speedX: 3.5, speedY: 2.25, dirX: -1, dirY: 1 });
					e.measure();
					e.x = -10; e.y = 50;
					e.bounceOffWalls();
					eq(e.dirX, 1, "chase bounce flips dirX");
					eq(e.dirY, 1, "chase bounce leaves the other axis alone");
					console.assert(Math.abs(e.speedX/3.5 - e.speedY/2.25) < 1e-9, "one restitution for both axes", e.speedX, e.speedY);
					ratios.push(e.speedX / 3.5);
				}
				console.assert(Math.min(...ratios) >= BH_THRUST_BOUNCE_MIN && Math.max(...ratios) <= BH_THRUST_BOUNCE_MAX, "restitution stays in range", Math.min(...ratios), Math.max(...ratios));
				console.assert(new Set(ratios).size > 1, "restitution is rerolled per bounce");
				// Thrust adds energy every frame, so its wall has to take more back than gravity's.
				console.assert(Math.max(...ratios) < 1, "a thrust wall always sheds speed", Math.max(...ratios));

				// ...and gravity takes the same lossy wall.
				fx.pullTowardBH = "gravity";
				const t = new Mover(dvd, { full: true, speedX: 3.5, speedY: 2.25, dirX: -1, dirY: 1 });
				t.measure();
				t.x = -10; t.y = 50;
				t.bounceOffWalls();
				eq(t.dirX, 1, "gravity bounce flips dirX");
				console.assert(t.speedX/3.5 >= BH_BOUNCE_MIN && t.speedX/3.5 <= BH_BOUNCE_MAX, "gravity restitution in range", t.speedX/3.5);
				fx.pullTowardBH = savedPull;
				screenWidth = savedW; screenHeight = savedH;

				// The hole picks both acts, and coming back from a teleport leaves no stray % offsets.
				const savedMode = holeMode, modes = new Set();
				for(let i = 0; i < 40; i++){ rollHolePattern(); modes.add(holeMode); }
				eq(modes.size, 2, "the hole rolls both patterns");
				console.assert(holeJumpEvery >= 2 && holeJumpEvery <= 6, "teleport interval in range", holeJumpEvery);
				randomlyRepositionElement(testHole.el, 100, 100);
				do { rollHolePattern(); } while(holeMode != "DVD");
				eq(testHole.el.style.right, "", "switching back to bouncing clears right");
				eq(testHole.el.style.bottom, "", "switching back to bouncing clears bottom");
				console.assert(testHole.x >= 0 && testHole.y >= 0, "hole position synced from the DOM", testHole.x, testHole.y);
				// In Zoomies a wall bounce makes the hole flinch — and only the clock's wall does,
				// or the hole would teleport itself off its own bounce and never stop.
				holeMode = "RANDOM";
				const zoomW = screenWidth, zoomH = screenHeight;
				screenWidth = 1920; screenHeight = 1080;
				const spots = new Set();
				for(let i = 0; i < 20; i++){
					const z = new Mover(dvd, { full: true, dirX: -1, dirY: 1 });
					z.measure();
					z.x = -10; z.y = 50;
					z.bounceOffWalls();
					spots.add(testHole.x + "," + testHole.y);
				}
				console.assert(spots.size > 1, "a wall bounce teleports every hole in Zoomies", spots.size);
				eq(testHole.x, testHole.el.getBoundingClientRect().left, "the mover follows the DOM after the flinch");
				testHole.x = -10; testHole.y = 50;
				testHole.bounceOffWalls();
				eq(testHole.x, 0, "a hole's own wall doesn't teleport it");
				screenWidth = zoomW; screenHeight = zoomH;
				holeMode = savedMode;

				// Done with the controlled test hole; hand the array back to whatever the live preset spawned.
				testHole.el.remove();
				holes = savedHoles;

				// The roulette: a wall reroll lands on every mode, and the pull rides the wave.
				fx.trigChase = true;
				const r = new Mover(dvd, { full: true, isHole: true });
				const drawn = new Set();
				for(let i = 0; i < 200; i++){ r.rollTrigChase(); drawn.add(r.pullMode); }
				eq(drawn.size, BH_MODES.length, "the wall rolls every hole mode");

				fx.pullTowardBH = "thrust";
				const wob = [];
				for(let i = 0; i < 200; i++) wob.push(r.trigWobble());
				console.assert(new Set(wob).size > 1, "the trig pull actually varies");
				console.assert(Math.max(...wob) <= TRIG_WOBBLE_MAX && Math.min(...wob) >= -TRIG_WOBBLE_MAX, "trig pull stays clamped", Math.min(...wob), Math.max(...wob));

				// Every draw must carry real authority. Two ways this went wrong before: the flat
				// shapes handed back amplitude zero, and peak-normalizing a spike train buried its
				// body at ~0.01. Both look identical on screen: nothing happening. So assert on the
				// typical level of every draw, not on its crest.
				const levels = [];
				for(let i = 0; i < 40; i++){
					r.rollTrigChase();
					let total = 0;
					for(let f = 0; f < 1000; f++) total += Math.abs(r.trigWobble());
					levels.push(total / 1000 / TRIG_WOBBLE_MAX);
				}
				console.assert(Math.min(...levels) > 0.1, "every trig draw pulls its weight", Math.min(...levels).toFixed(3));

				// ...and pulls it in one direction. A wave centered on zero measures strong here
				// while netting nothing: it shakes the clock instead of moving it toward the hole.
				const nets = [];
				for(let i = 0; i < 40; i++){
					r.rollTrigChase();
					let signed = 0, gross = 0;
					for(let f = 0; f < 1800; f++){
						const w = r.trigWobble();
						signed += w; gross += Math.abs(w);
					}
					nets.push(signed / gross);
				}
				console.assert(Math.min(...nets) > 0.4, "the trig pull nets out, it doesn't cancel itself", Math.min(...nets).toFixed(2));

				// ...and the same wave moves the clock, not just the gain on the pull. Both axes
				// have to travel, and not in lockstep: one shared frame makes the drift a diagonal.
				do { r.rollTrigChase(); } while(r.trigScale == 0);
				r.x = 0; r.y = 0;
				let dxTotal = 0, dyTotal = 0, lockstep = 0, worst = 0;
				for(let f = 0; f < 1000; f++){
					const px = r.x, py = r.y;
					r.trigWobble();   // this is what advances the frame
					r.trigDrift();
					const dx = r.x - px, dy = r.y - py;
					dxTotal += Math.abs(dx); dyTotal += Math.abs(dy);
					worst = Math.max(worst, Math.abs(dx), Math.abs(dy));
					if(Math.abs(dx - dy) < 1e-9) lockstep++;
				}
				console.assert(dxTotal > 100 && dyTotal > 100, "the trig drift actually moves the clock", dxTotal, dyTotal);

				// Wobbleton's gravity is the same curve with the ends pulled in: softer where it
				// used to yank, present where it used to be nothing. Measured against plain gravity
				// with the wobble neutralized, so this reads the curve and not the wave.
				// trigScale 0 collapses the wave to its DC bias, a known constant we divide back
				// out; chaseMul 0.1 keeps both readings clear of BH_MAX_ACCEL, which would clamp
				// the near field to the same 8 either way and hide the very thing under test.
				const curveAt = (on, dist) => {
					const c = new Mover(document.createElement("div"), { full: true, dirX: 1, dirY: 1, speedX: 0, speedY: 0 });
					c.measure();
					c.x = 500 - dist - c.w/2; c.y = 500 - c.h/2;
					c.trigScale = 0; c.chaseMul = 0.1;
					fx.trigChase = on; fx.pullTowardBH = "gravity";
					c.chase(target);
					return Math.abs(c.dirX * c.speedX) / (on ? TRIG_BIAS * TRIG_WOBBLE_MAX : 1);
				};
				console.assert(curveAt(true, 20) < curveAt(false, 20), "Wobbleton eases gravity up close", curveAt(true, 20), curveAt(false, 20));
				console.assert(curveAt(true, 900) > curveAt(false, 900), "...and gives it reach across the room", curveAt(true, 900), curveAt(false, 900));
				// "a bit", not "a different force": the near/far ratio has to stay recognisable.
				console.assert(curveAt(true, 20) > 3 * curveAt(true, 900), "gravity is still gravity", curveAt(true, 20), curveAt(true, 900));
				console.assert(lockstep < 1000, "X and Y drift are out of phase", lockstep);
				console.assert(worst <= TRIG_DRIFT + 1e-9, "trig drift stays clamped", worst);
				fx.trigChase = false;
				fx.pullTowardBH = savedPull;

				eq(DVD_ANIM.length, PRESETS.length, "a clock animation per preset");
				eq(BG_ANIM.length, PRESETS.length, "a bg animation slot per preset");
				fx.wrapX = savedWrapXOuter; fx.wrapY = savedWrapYOuter;
				console.log("selfTest done");
			}

			changeFuncGroup(0);   // random preset
			// Start the animation's first frame
			window.requestAnimationFrame(animate);
			if(location.search.includes("test")) selfTest();
		</script>
	</body>
</html>
